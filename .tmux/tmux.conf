# ==========================
# ===  General settings  ===
# ==========================

# Omarchy owns the Linux palette. Other systems keep Catppuccin.
if-shell 'test "$(uname -s)" = Linux && command -v omarchy-theme-color >/dev/null 2>&1' \
  'set -g @dotfiles_omarchy on' 'set -g @dotfiles_omarchy off'

set -g default-terminal 'tmux-256color'
# Assign array entries so a reload does not append duplicate capabilities.
set -g terminal-overrides[100] 'xterm*:Tc:sitm=\E[3m'
set -g terminal-features[100] 'xterm*:RGB:clipboard'
set -g terminal-features[101] 'xterm-kitty:extkeys'
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
setw -g aggressive-resize on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

# Show the current window in the terminal title.
set -g set-titles on
set -g set-titles-string '#I:#W'

# Start window and pane indices at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

if-shell 'command -v zsh >/dev/null 2>&1' \
  'run-shell "tmux set -g default-shell \"$(command -v zsh)\"; tmux set -g default-command \"$(command -v zsh)\""'

# ==================================================
# === Window monitoring for activity and silence ===
# ==================================================

bind m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind M if -F '#{monitor-silence}' \
  'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
  'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'
set -g visual-activity on

# =====================================
# ===        Renew environment      ===
# =====================================

set -g update-environment \
  'DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY'
bind '$' run-shell 'bash ~/.tmux/renew_env.sh'

source-file ~/.tmux/plugins.conf

# Catppuccin defines the modules before TPM processes CPU and battery formats.
if -F '#{==:#{@dotfiles_omarchy},off}' {
  if-shell 'test -f "$HOME/.tmux-plugins/tmux/catppuccin.tmux"' \
    'run-shell "bash ~/.tmux-plugins/tmux/catppuccin.tmux"' \
    'display-message "Catppuccin is missing from ~/.tmux-plugins/tmux"'
}
source-file ~/.tmux/appearance.conf

if-shell 'test -f "$HOME/.tmux-plugins/tpm/tpm"' \
  'run-shell "bash ~/.tmux-plugins/tpm/tpm"' \
  'display-message "TPM is missing from ~/.tmux-plugins/tpm"'

# Custom bindings and copy commands must win over plugin defaults.
source-file ~/.tmux/keybindings.conf
source-file ~/.tmux/copy-mode.conf

# The first session does not exist yet while the server reads its config.
# The hook applies the palette after session creation. The command handles reloads.
if -F '#{==:#{@dotfiles_omarchy},on}' {
  set-hook -g session-created[100] 'run-shell "bash ~/.tmux/omarchy-theme.sh -S #{q:socket_path}"'
  run-shell 'bash ~/.tmux/omarchy-theme.sh -S #{q:socket_path}'
}
