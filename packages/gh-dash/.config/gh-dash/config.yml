prSections:
  - title: Mine
    filters: is:open author:@me
  - title: Teammates
    filters: is:open author:pasteichen_afklm author:noraji-ext_afklm author:thtricot-ext_afklm author:lubancroftrichardson_afklm
  - title: BW-Discuss
    filters: is:open label:bw-discuss
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 70
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  prs:
    - key: C
      name: Code Review
      command: >
        tmux new-window -n {{.RepoName}}
        'nvim -c
        ":silent Octo pr edit {{.PrNumber}}"'
    - key: T
      name: See Actions
      command: >-
        tmux new-window '
        gh enhance -R {{.RepoName}} {{.PrNumber}}
        '
    - key: alt+c
      name: Code Review (Herdr)
      command: >-
        tab=$(herdr tab create --workspace "${HERDR_WORKSPACE_ID:?Run gh-dash inside Herdr}"
        --cwd "$PWD" --label "{{.RepoName}}" --focus) &&
        pane=$(printf '%s' "$tab" | jq -er '.result.root_pane.pane_id') &&
        herdr pane run "$pane" "nvim -c ':silent Octo pr edit {{.PrNumber}}'" >/dev/null
    - key: alt+t
      name: See Actions (Herdr)
      command: >-
        tab=$(herdr tab create --workspace "${HERDR_WORKSPACE_ID:?Run gh-dash inside Herdr}"
        --cwd "$PWD" --label "{{.RepoName}}" --focus) &&
        pane=$(printf '%s' "$tab" | jq -er '.result.root_pane.pane_id') &&
        herdr pane run "$pane" "gh enhance -R {{.RepoName}} {{.PrNumber}}" >/dev/null
repoPaths: {}
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
