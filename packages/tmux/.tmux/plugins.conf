# =====================================
# ===          Plugins              ===
# =====================================

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux-plugins/"

# TPM's file parser does not follow two levels of source-file commands.
# Its runtime list also keeps Catppuccin out of the Omarchy server.
set -g @tpm_plugins 'tmux-plugins/tpm'
set -ag @tpm_plugins ' tmux-plugins/tmux-sensible'
set -ag @tpm_plugins ' tmux-plugins/tmux-battery'
set -ag @tpm_plugins ' tmux-plugins/tmux-copycat'
set -ag @tpm_plugins ' tmux-plugins/tmux-open'
set -ag @tpm_plugins ' tmux-plugins/tmux-yank'
set -ag @tpm_plugins ' tmux-plugins/tmux-cpu'
set -ag @tpm_plugins ' christoomey/vim-tmux-navigator'
set -ag @tpm_plugins ' omerxx/tmux-floax'
set -ag @tpm_plugins ' junegunn/tmux-fzf-url'
if -F '#{==:#{@dotfiles_omarchy},off}' 'set -ag @tpm_plugins " catppuccin/tmux"'

# Set Catppuccin options before TPM loads the plugin on macOS.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g @floax-text-color 'white'
set -g @floax-border-color '#d75423'
set -g @floax-bind 'h'
set -g @floax-width '95%'
set -g @floax-height '85%'
set -g @floax-session-name 'floax'
set -g @open-S 'https://www.google.com/search?q='
