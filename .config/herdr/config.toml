onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# Follow each host terminal's palette (Kanagawa here, Omarchy on Omarchy).
name = "kanagawa"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Config and help
reload_config = "prefix+ctrl+r"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+_", "alt+enter"]
split_vertical = ["prefix+|", "prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# focus_pane_down = "ctrl+alt+down"
# focus_pane_up = "ctrl+alt+up"
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
focus_pane_down = ""
focus_pane_up = ""

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
# Emptied because of the HerdrBar plugin
close_tab = ""
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left", "alt+h"]
next_tab = ["prefix+n", "alt+right", "alt+l"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+q"
previous_workspace = ["prefix+shift+p", "alt+up", "alt+k"]
next_workspace = ["prefix+shift+n", "alt+down", "alt+j"]

# Worktrees
new_worktree = "prefix+shift+w"
open_worktree = "prefix+shift+g"
remove_worktree = "prefix+shift+x"

# herdr-nvim
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# vim-navigator
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

# Sesh
[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "fedeya.herdr-sesh.open"
description = "sesh picker"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "fedeya.herdr-sesh.last"
description = "jump to previous workspace"

# Pluck
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck visible token"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "open visible URL"

# Herdr plus
[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

# Herdr customize
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-customize.open"
description = "Herdr Customize"

# Herdr bar
[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[ui]
sidebar_width = 30
sidebar_collapsed_mode = "hidden"

pane_borders = "always"
pane_outer_borders = true
pane_gaps = true

tab_bar_position = "bottom"

accent = "cyan"

tab_bar_right = [
{ type = "zoom" },
{ type = "datetime", format = "%A, %B %d - %H:%M:%S" },
{ type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session always asked
confirm_close = true

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"

[ui.sidebar.spaces]
row_gap = 1
rows = [
	["state_icon", "workspace"],
	["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
	["state_icon", "machine", "workspace", "tab"],
	["agent"],
]

[ui.toast]
delivery = "herdr"
